name: Apply zero latency frontend

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-zero-latency-frontend.yml

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply zero latency patch
        run: python scripts/apply_zero_latency_frontend.py

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Clean caches
        run: rm -rf .next node_modules/.cache

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-build-key
        run: npm run build

      - name: Commit optimized frontend
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/components/auditoria/AuditoriaCasa.tsx \
            src/components/auditoria/PainelParede.tsx \
            src/components/auditoria/ListaAuditorias.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Implementa optimistic UI e cache zero-latency"
          git push
