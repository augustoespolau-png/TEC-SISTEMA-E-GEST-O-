name: Apply audit reset photo fastfix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-audit-reset-photo-fastfix.yml'
      - '.github/scripts/apply_audit_reset_photo_fastfix.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply patch
        run: python .github/scripts/apply_audit_reset_photo_fastfix.py

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Clean build cache
        run: rm -rf .next node_modules/.cache

      - name: Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-build-key
        run: npm run build

      - name: Commit validated patch
        shell: bash
        run: |
          if git diff --quiet -- src/components/auditoria/AuditoriaCasa.tsx src/components/auditoria/PainelParede.tsx; then
            echo "No application changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/auditoria/AuditoriaCasa.tsx src/components/auditoria/PainelParede.tsx
          git commit -m "Ajusta reset, foto e latência da auditoria"
          git push origin HEAD:main
