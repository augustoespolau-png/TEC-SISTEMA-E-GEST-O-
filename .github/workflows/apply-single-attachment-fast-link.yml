name: Apply single attachment fast link

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/apply_single_attachment_fast_link.py'
      - '.github/workflows/apply-single-attachment-fast-link.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply patch
        run: python .github/scripts/apply_single_attachment_fast_link.py
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Clean build cache
        run: rm -rf .next node_modules/.cache
      - name: Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-build-key
        run: npm run build
      - name: Commit validated patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/auditoria/SeletorFoto.tsx src/components/auditoria/AuditoriaCasa.tsx
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Restaura anexo único e acelera vínculo da foto"
          git push origin HEAD:main
