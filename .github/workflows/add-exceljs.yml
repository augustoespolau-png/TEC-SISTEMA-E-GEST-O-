name: Add ExcelJS dependency

on:
  push:
    paths:
      - '.github/workflows/add-exceljs.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install exceljs@4.4.0 --save
      - name: Commit dependency
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "Adiciona suporte a exportação XLSX"
          git push
