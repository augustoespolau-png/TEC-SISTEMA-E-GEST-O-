name: Fix optimistic pending rework

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-retrabalho-pending-optimistic.yml
      - .github/scripts/fix_retrabalho_pending_optimistic.py

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply pending-status patch
        run: python .github/scripts/fix_retrabalho_pending_optimistic.py
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint -- --max-warnings=0
      - name: Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-build-key
        run: npm run build
      - name: Verify business rule
        run: grep -Fq '!gestao && status === "RETRABALHO" ? "RETRABALHO_PENDENTE" : status' src/components/OcorrenciaCard.tsx
      - name: Commit validated source
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/OcorrenciaCard.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Preserva status pendente no optimistic UI'
          git push origin HEAD:main
