name: Apply instant audit flows

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-instant-audit-flows.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply frontend zero-latency patch
        run: python .github/scripts/apply_instant_audit_flows.py

      - name: Clean install
        run: |
          rm -rf .next node_modules
          npm ci

      - name: Lint strict
        run: npm run lint -- --max-warnings=0

      - name: Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-build-key
        run: npm run build

      - name: Commit validated patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-instant-audit-flows.yml .github/scripts/apply_instant_audit_flows.py
          git add src/lib/auditoria.ts src/components/auditoria/SeletorFoto.tsx src/components/auditoria/FormularioErro.tsx src/components/auditoria/FormularioNa.tsx src/components/auditoria/PainelParede.tsx src/components/auditoria/AuditoriaCasa.tsx
          git commit -m "Torna NAs e erros instantâneos na auditoria"
          git push origin HEAD:main
