name: Verify production build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Clean Next.js caches
        run: |
          rm -rf .next
          rm -rf node_modules/.cache

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-build-key
        run: npm run build

      - name: Verify audit UI in compiled bundle
        shell: bash
        run: |
          grep -R -Fq "Itens que não se aplicam" .next
          grep -R -Fq "Anexo / foto do desvio (opcional)" .next
          echo "Compiled bundle contains multi-NA and photo attachment UI."

      - name: Verify deployed commit and domain
        shell: bash
        run: |
          expected="$GITHUB_SHA"
          preferred="https://tecverde-erros.vercel.app/api/version"
          project="https://tec-sistema-e-gestao.vercel.app/api/version"

          for attempt in $(seq 1 24); do
            preferred_body="$(curl -fsS --max-time 10 "$preferred" 2>/dev/null || true)"
            project_body="$(curl -fsS --max-time 10 "$project" 2>/dev/null || true)"

            echo "Attempt $attempt"
            echo "tecverde-erros: $preferred_body"
            echo "tec-sistema-e-gestao: $project_body"

            if printf '%s' "$preferred_body" | grep -Fq "$expected"; then
              echo "Production domain is serving commit $expected"
              exit 0
            fi

            if printf '%s' "$project_body" | grep -Fq "$expected"; then
              echo "::warning::The Vercel project domain is current, but tecverde-erros.vercel.app is not serving this commit. Check the production alias/domain assignment in Vercel."
              exit 0
            fi

            sleep 5
          done

          echo "::error::Neither checked Vercel domain served commit $expected"
          exit 1
