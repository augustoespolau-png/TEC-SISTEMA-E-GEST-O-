name: Verify production build

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Patch XLSX adapter
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          path = Path('src/lib/exportar.ts')
          text = path.read_text()
          old_blob = '  const url = URL.createObjectURL(\n    new Blob([bytes], {\n      type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet",\n    })\n  );'
          new_blob = '  const arquivo = bytes.buffer.slice(\n    bytes.byteOffset,\n    bytes.byteOffset + bytes.byteLength\n  ) as ArrayBuffer;\n  const url = URL.createObjectURL(\n    new Blob([arquivo], {\n      type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet",\n    })\n  );'
          if old_blob not in text:
              raise SystemExit('Bloco Blob XLSX não encontrado')
          text = text.replace(old_blob, new_blob, 1)
          pacote = 'const PACOTE_XLSX = "__TECVERDE_XLSX__";\n\nexport function montarCsv(itens: LinhaExportada[]): string {\n  return PACOTE_XLSX + JSON.stringify(itens);\n}\n\n'
          text, n = re.subn(r'export function montarCsv\(itens: LinhaExportada\[\]\): string \{.*?\n\}\n\n(?=export function nomeDoArquivo)', pacote, text, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('montarCsv não encontrado')
          old_nome = 'export function nomeDoArquivo(partes: string[], hoje: string): string {\n  return nomeDoArquivoExcel(partes, hoje).replace(/\\.xlsx$/i, ".csv");\n}'
          new_nome = 'export function nomeDoArquivo(partes: string[], hoje: string): string {\n  return nomeDoArquivoExcel(partes, hoje);\n}'
          if old_nome not in text:
              raise SystemExit('nomeDoArquivo antigo não encontrado')
          text = text.replace(old_nome, new_nome, 1)
          baixar = 'export function baixar(nome: string, conteudo: string) {\n  if (conteudo.startsWith(PACOTE_XLSX)) {\n    const itens = JSON.parse(conteudo.slice(PACOTE_XLSX.length)) as LinhaExportada[];\n    const projetos = [...new Set(itens.map((item) => campo(item, "projeto")).filter(Boolean))];\n    const casas = [...new Set(itens.map((item) => campo(item, "casa")).filter(Boolean))];\n    const situacoes = [...new Set(itens.map((item) => item.especie === "erro" ? (ROTULO_STATUS[item.erro.status] ?? item.erro.status) : "PAREDE OK"))];\n    void baixarExcel(nome.replace(/\\.csv$/i, ".xlsx"), itens, {\n      projeto: projetos.length === 1 ? projetos[0] : "Todos os projetos",\n      casa: casas.length === 1 ? casas[0] : null,\n      situacao: situacoes.length === 1 ? situacoes[0] : "Múltiplas situações",\n      total: itens.length,\n    }).catch((erro) => console.error("Erro ao gerar Excel", erro));\n    return;\n  }\n  const url = URL.createObjectURL(new Blob([conteudo], { type: "text/csv;charset=utf-8;" }));\n  const a = document.createElement("a");\n  a.href = url;\n  a.download = nome;\n  document.body.appendChild(a);\n  a.click();\n  a.remove();\n  URL.revokeObjectURL(url);\n}\n'
          text, n = re.subn(r'export function baixar\(nome: string, conteudo: string\) \{.*?\n\}\s*$', baixar, text, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('baixar não encontrado')
          path.write_text(text)
          PY

      - name: Clean Next.js caches
        run: |
          rm -rf .next
          rm -rf node_modules/.cache

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-build-key
        run: npm run build

      - name: Verify XLSX implementation
        run: |
          grep -R -Fq "TECVERDE — RELATÓRIO DE OCORRÊNCIAS E HISTÓRICO DA QUALIDADE" .next
          grep -q '__TECVERDE_XLSX__' src/lib/exportar.ts
          grep -q 'exceljs' package.json

      - name: Commit validated XLSX sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/exportar.ts
          git diff --cached --quiet && exit 0
          git commit -m "Ativa exportação XLSX profissional na Consulta"
          git push
