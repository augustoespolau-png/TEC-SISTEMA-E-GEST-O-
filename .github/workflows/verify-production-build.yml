name: Verify production build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Clean Next.js caches
        run: |
          rm -rf .next
          rm -rf node_modules/.cache

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Verify instant audit flows in source
        shell: bash
        run: |
          grep -Fq "Sincronizando em segundo plano" src/components/auditoria/AuditoriaCasa.tsx
          grep -Fq "Foto enviando…" src/components/auditoria/PainelParede.tsx
          grep -Fq "submetendoRef" src/components/auditoria/FormularioErro.tsx
          grep -Fq "submetendoRef" src/components/auditoria/FormularioNa.tsx
          grep -Fq "Diagnóstico do Sistema" src/components/config/DiagnosticoSistemaCard.tsx
          grep -Fq "diagnostico_sistema_health_check" src/app/api/diagnostico/route.ts
          grep -Fq "diagnostico-sistema-15min" supabase/migrations/044_internal_ai_diagnostic_healthcheck.sql
          if grep -Fq "Salvando…" src/components/auditoria/FormularioErro.tsx; then
            echo "::error::FormularioErro voltou a bloquear o inspetor com Salvando…"
            exit 1
          fi
          if grep -Fq "Salvando…" src/components/auditoria/FormularioNa.tsx; then
            echo "::error::FormularioNa voltou a bloquear o inspetor com Salvando…"
            exit 1
          fi

      - name: Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-build-key
        run: npm run build

      - name: Verify audit UI in compiled bundle
        shell: bash
        run: |
          grep -R -Fq "Itens que não se aplicam" .next
          grep -R -Fq "Anexo / foto do desvio (opcional)" .next
          grep -R -Fq "Foto enviando…" .next
          grep -R -Fq "Diagnóstico do Sistema" .next
          grep -R -Fq "Assistente de Correção" .next
          grep -R -Fq "TECVERDE — RELATÓRIO DE OCORRÊNCIAS E HISTÓRICO DA QUALIDADE" .next
          echo "Compiled bundle contains audit UI, diagnostic status, safe correction assistant and professional XLSX export."

      - name: Verify deployed commit and domain
        shell: bash
        run: |
          expected="$GITHUB_SHA"
          preferred="https://tecverde-erros.vercel.app/api/version"
          project="https://tec-sistema-e-gestao.vercel.app/api/version"

          for attempt in $(seq 1 24); do
            preferred_body="$(curl -fsS --max-time 10 "$preferred" 2>/dev/null || true)"
            project_body="$(curl -fsS --max-time 10 "$project" 2>/dev/null || true)"

            echo "Attempt $attempt"
            echo "tecverde-erros: $preferred_body"
            echo "tec-sistema-e-gestao: $project_body"

            if printf '%s' "$preferred_body" | grep -Fq "$expected"; then
              echo "Production domain is serving commit $expected"
              exit 0
            fi

            if printf '%s' "$project_body" | grep -Fq "$expected"; then
              echo "::warning::The Vercel project domain is current, but tecverde-erros.vercel.app is not serving this commit. Check the production alias/domain assignment in Vercel."
              exit 0
            fi

            sleep 5
          done

          echo "::error::Neither checked Vercel domain served commit $expected"
          exit 1
