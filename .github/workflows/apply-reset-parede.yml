name: Apply wall reset and defect removal

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-reset-parede.yml
      - .github/scripts/patch_reset_parede.py

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply reset/removal patch
        run: python .github/scripts/patch_reset_parede.py

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint -- --max-warnings=0

      - name: Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-build-key
        run: npm run build

      - name: Verify wall reset flow
        shell: bash
        run: |
          grep -Fq '"REMOVER_DESVIO",' src/lib/qualidadeCompat.ts
          grep -Fq '"ZERAR_INSPECAO_PAREDE",' src/lib/qualidadeCompat.ts
          grep -Fq 'async function zerarInspecaoParede' src/components/auditoria/AuditoriaCasa.tsx
          grep -Fq 'aoZerarInspecao={() => zerarInspecaoParede(paredeAberta)}' src/components/auditoria/AuditoriaCasa.tsx
          grep -Fq 'Zerar inspeção' src/components/auditoria/PainelParede.tsx
          if grep -Fq 'apenas a gestão pode excluir registros' src/components/auditoria/AuditoriaCasa.tsx; then
            echo 'Mensagem incorreta de permissão ainda presente.'
            exit 1
          fi

      - name: Commit validated source
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib/qualidadeCompat.ts src/components/auditoria/AuditoriaCasa.tsx src/components/auditoria/PainelParede.tsx
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git commit -m 'Permite remover desvio e zerar inspeção da parede'
          git push origin HEAD:main
