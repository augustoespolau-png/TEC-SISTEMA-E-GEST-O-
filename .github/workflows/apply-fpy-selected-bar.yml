name: Apply FPY selected bar

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-fpy-selected-bar.yml
      - .github/scripts/apply_fpy_selected_bar.py

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply FPY interaction patch
        run: python .github/scripts/apply_fpy_selected_bar.py

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint -- --max-warnings=0

      - name: Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-build-key
        run: npm run build

      - name: Verify selected-bar behavior in source
        shell: bash
        run: |
          grep -Fq 'paredesTempo={recorte.paredesTempo}' src/components/indicadores/Indicadores.tsx
          grep -Fq 'pontos={fpyPorDia(paredesTempo)}' src/components/indicadores/FolhaFpy.tsx
          grep -Fq 'pontos={fpyPorSemana(paredesTempo)}' src/components/indicadores/FolhaFpy.tsx
          grep -Fq 'const larguraBarra = Math.max(14, Math.min(40, passo * 0.54));' src/components/indicadores/Graficos.tsx
          grep -Fq 'fillOpacity={0.42}' src/components/indicadores/Graficos.tsx
          echo 'FPY selected-bar interaction verified.'

      - name: Commit validated source
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/indicadores/Indicadores.tsx src/components/indicadores/FolhaFpy.tsx src/components/indicadores/Graficos.tsx
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git commit -m 'Destaca seleção temporal do FPY com barra'
          git push origin HEAD:main
