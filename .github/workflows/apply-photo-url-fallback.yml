name: Apply photo URL fallback

on:
  push:
    branches: [main]
    paths:
      - scripts/apply-photo-url-fallback.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Stop cleanly when patch script was removed
        id: guard
        shell: bash
        run: |
          if [ -f scripts/apply-photo-url-fallback.py ]; then
            echo "run_patch=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_patch=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        if: steps.guard.outputs.run_patch == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply patch
        if: steps.guard.outputs.run_patch == 'true'
        run: python3 scripts/apply-photo-url-fallback.py

      - name: Install dependencies
        if: steps.guard.outputs.run_patch == 'true'
        run: npm ci

      - name: Lint
        if: steps.guard.outputs.run_patch == 'true'
        run: npm run lint

      - name: Build
        if: steps.guard.outputs.run_patch == 'true'
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-build-key
        run: npm run build

      - name: Commit validated patch
        if: steps.guard.outputs.run_patch == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/auditoria/AuditoriaCasa.tsx
          if git diff --cached --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git commit -m "Garante exibição imediata da foto anexada"
          git pull --rebase origin main
          git push origin HEAD:main
