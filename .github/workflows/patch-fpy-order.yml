name: Patch FPY order

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Executa patch ordem FPY'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Fix ascending house order
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/components/indicadores/FolhaFpy.tsx')
          s = p.read_text()
          old = 'casas={[...r.casas].reverse()}'
          new = 'casas={r.casas}'
          if old not in s:
              raise SystemExit('Expected FPY house reverse expression not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit patch and remove helper workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-fpy-order.yml
          git add src/components/indicadores/FolhaFpy.tsx
          git commit -m "Ordena casas do FPY de forma crescente"
          git push origin main
